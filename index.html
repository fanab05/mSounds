<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mSounds</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top bar with the app name -->
  <header class="app-header">
    <h1>mSounds</h1>
  </header>

  <!-- Two columns: sidebar | main area.
       On narrow screens the sidebar becomes a strip above the list. -->
  <div class="layout">

    <!-- Sidebar: Library entry, playlists, "New playlist" form.
         app.js fills the playlist list and marks the active item. -->
    <aside class="sidebar">
      <nav class="side-nav" aria-label="Library and playlists">
        <button id="nav-library" class="nav-item" type="button">Library</button>
        <h2 class="side-heading">Playlists</h2>
        <ul id="playlist-nav" class="playlist-nav"></ul>
        <p id="no-playlists" class="side-empty">No playlists yet</p>
      </nav>

      <!-- A real form: pressing Enter in the box also creates the playlist -->
      <form id="new-playlist-form" class="new-playlist">
        <input id="new-playlist-input" type="text" maxlength="60"
               placeholder="New playlist" aria-label="New playlist name"
               autocomplete="off">
        <button class="btn btn-primary" type="submit">Create</button>
      </form>
    </aside>

    <!-- Main area: heading, search (library only), list -->
    <main class="content">

      <!-- app.js draws the heading here: "Library", or the playlist name
           with Rename / Delete buttons (or the inline rename form) -->
      <div id="view-header" class="view-header"></div>

      <!-- Search box. type="search" gives a clear (x) button in most browsers.
           app.js filters the list on every "input" event (every keystroke).
           It is hidden in a playlist view: search only applies to the library. -->
      <input id="search-input" class="search" type="search"
             placeholder="Search by title or artist"
             aria-label="Search tracks" autocomplete="off">

      <!-- Used for errors AND short confirmations ("Added ...").
           role="alert" makes screen readers announce it. -->
      <p id="message" class="message" role="alert" hidden></p>

      <!-- app.js fills this list with one <li> per track that is shown -->
      <ul id="track-list" class="track-list"></ul>

      <!-- Shown by app.js when the list is empty. The text depends on the view:
           "No tracks found" (library) or "This playlist is empty".
           aria-live="polite" lets screen readers announce it. -->
      <p id="no-results" class="no-results" aria-live="polite" hidden>No tracks found</p>
    </main>
  </div>

  <!-- Player bar, fixed at the bottom of the screen.
       Three columns: track info | controls + progress | volume -->
  <footer class="player-bar">

    <!-- Left: what is playing -->
    <div class="now-playing">
      <div id="np-title" class="np-title">Nothing playing</div>
      <div id="np-artist" class="np-artist">Pick a track</div>
    </div>

    <!-- Middle: buttons on top, progress bar below -->
    <div class="player-center">
      <div class="controls">
        <!-- &#9198; = previous symbol, &#9197; = next symbol.
             &#xFE0E; asks the browser to draw it as plain text, not a coloured emoji -->
        <button id="prev-btn" class="ctrl-btn" type="button" aria-label="Previous track" disabled>&#9198;&#xFE0E;</button>
        <button id="play-btn" class="play-btn" type="button" aria-label="Play">▶</button>
        <button id="next-btn" class="ctrl-btn" type="button" aria-label="Next track" disabled>&#9197;&#xFE0E;</button>
      </div>

      <div class="progress">
        <span id="time-elapsed" class="time time-elapsed">0:00</span>
        <!-- A slider counted in SECONDS. app.js sets the real max when the mp3 is ready.
             step="any" lets it move smoothly instead of in whole steps. -->
        <input id="seek-bar" class="range" type="range"
               min="0" max="0" step="any" value="0" disabled aria-label="Seek">
        <span id="time-remaining" class="time time-remaining">-0:00</span>
      </div>
    </div>

    <!-- Right: volume (0 to 100) -->
    <div class="volume">
      <span class="volume-icon" aria-hidden="true">🔊</span>
      <input id="volume-bar" class="range" type="range"
             min="0" max="100" step="1" value="80" aria-label="Volume">
    </div>
  </footer>

  <!-- Order matters: tracks.js defines TRACKS, app.js uses it.
       Scripts are at the end so the HTML above already exists when they run. -->
  <script src="tracks.js"></script>
  <script src="app.js"></script>
</body>
</html>
